# docker compose up -d --build     → http://localhost:3000   (the admin is at /admin)
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy
name: metrohot

x-app: &app
  build: .
  image: metrohot-app
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    # No proxy in front limits pushes to /api/ingest/items: the api does (per client and minute; 0 turns it off).
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the demo sources, then exits.
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    volumes:
      - data:/data
      - ./site:/app/site
      - ./industry:/app/industry
      - ./packages:/app/packages
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # Let the worker drain backups and paid calls (STOP_TIMEOUT_MS, 470 s), then close its database.
    # Docker sends SIGTERM to the worker first; after this window it kills the remaining processes.
    stop_grace_period: 515s
    volumes:
      - data:/data
      - ./site:/app/site
      - ./industry:/app/industry
      - ./packages:/app/packages
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    # SSR reads the API over HTTP; backend credentials and stored files stay in api/worker.
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./apps/web/build:/app/apps/web/build
      - ./site:/app/site
      - ./industry:/app/industry
    depends_on:
      api:
        condition: service_started

  # Optional WeChat official-account feeds (完整公众号增量). Off unless --profile wechat:
  #   docker compose --profile wechat up -d we-mp-rss
  # Third-party service (https://github.com/rachelos/we-mp-rss, MIT) that turns subscribed
  # accounts into RSS feeds. Scan the QR code in its admin (SSH tunnel to port 8001) to authorize;
  # add its feeds to this site as rss sources with PRIVATE_FEED_HOSTS=we-mp-rss in .env.
  # It tracks new posts only — no history backfill — and never bypasses verification.
  we-mp-rss:
    image: ghcr.io/rachelos/we-mp-rss:latest
    profiles: ["wechat"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DB: sqlite:///data/we_mp_rss.db
      SECRET_KEY: ${WE_MP_RSS_SECRET_KEY:-we-mp-rss-change-me}
      USERNAME: ${WE_MP_RSS_USERNAME:-admin}
      PASSWORD: ${WE_MP_RSS_PASSWORD:-}
      # 公众号平台扫码对个人微信报"系统错误"，默认走微信读书 Cookie 模式（只取最新一篇）
      GATHER.MODEL: ${GATHER_MODEL:-weread_mp}
      WEREAD_COOKIE: ${WEREAD_COOKIE:-}
      WEREAD_CONTENT_INTERVAL: ${WEREAD_CONTENT_INTERVAL:-2}
      # RSS 单源输出条数：默认 30 只覆盖最新文章，历史回补（scripts/wechat-mp-history）会排不进 feed
      RSS_PAGE_SIZE: ${RSS_PAGE_SIZE:-300}
    volumes:
      - we_mp_rss_data:/app/data

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
  we_mp_rss_data: {}
